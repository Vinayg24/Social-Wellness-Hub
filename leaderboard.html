<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Leaderboard</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <!-- Include Swiper or other CSS if needed -->
</head>
<body>
  <!-- ***** Header Area ***** -->
  <header class="header">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <div class="intro d-flex justify-content-between align-items-end m-0">
            <div class="intro-content">
              <h3 class="mt-3 mb-0">Team Leaderboard</h3>
            </div>
            <div class="intro-btn">
              <a class="btn content-btn" href="index.html">Back to Home</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>
  
  <!-- ***** Leaderboard Area Start ***** -->
  <section class="leaderboard-area p-0">
    <div class="container">
      <div class="row">
        <div class="col-12">
          <!-- Leaderboard Table -->
          <div class="leaderboard-table">
            <table class="table table-striped">
              <thead>
                <tr>
                  <th scope="col">Rank</th>
                  <th scope="col">Name</th>
                  <th scope="col">Position</th>
                  <th scope="col">Achievements</th>
                </tr>
              </thead>
              <tbody>
                <!-- Team Member 1 -->
                <tr>
                  <th scope="row">1</th>
                  <td>Vinay Goswami</td>
                  <td>CEO</td>
                  <td>Top Performer 2024</td>
                </tr>
                <!-- Team Member 2 -->
                <tr>
                  <th scope="row">2</th>
                  <td>Rajat Gepala</td>
                  <td>CEO</td>
                  <td>Innovator Award 2024</td>
                </tr>
                <!-- Team Member 3 -->
                <tr>
                  <th scope="row">3</th>
                  <td>Shashank Raman</td>
                  <td>CEO</td>
                  <td>Leadership Excellence</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- ***** Leaderboard Area End ***** -->

  <!-- ***** Footer Area ***** -->
  <footer class="footer">
    <div class="container text-center">
      <p>&copy; 2024 Your Company. All Rights Reserved.</p>
    </div>
  </footer>

  <!-- Include any JS or Swiper JS for effects if needed -->
  <script src="assets/js/main.js"></script>
</body>
</html>
